name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  quality-gate:
    # Fails the build if fact-checking accuracy drops below the bounds in
    # config/quality_gates.yaml. Pure Python, about 5 seconds of benchmark.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache RAGTruth
        uses: actions/cache@v4
        with:
          path: data/ragtruth
          key: ragtruth-${{ hashFiles('scripts/download_ragtruth.sh') }}

      - name: Download RAGTruth
        run: ./scripts/download_ragtruth.sh

      - name: Quality gate (fast)
        run: python -m groundwire.evals.gate --suite fast

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-fast
          path: results/gates/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t groundwire:ci .
      - name: Smoke test
        run: |
          docker run -d --name gw -p 8000:8000 groundwire:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8000/healthz && break
            sleep 1
          done
          curl -fsS -X POST localhost:8000/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"demo","messages":[{"role":"user","content":"hi"}]}'
          docker logs gw

  money-agent:
    # apps/money-agent: lint, strict types, and every test, including the storage
    # contract on a real Postgres + pgvector and end-to-end runs through a real
    # Groundwire gateway (installed from this checkout).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/money-agent
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: money
          POSTGRES_PASSWORD: money
          POSTGRES_DB: money_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U money -d money_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MONEY_TEST_DATABASE_URL: postgresql://money:money@localhost:5432/money_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (app + gateway for the end-to-end tests)
        run: pip install -e ../.. -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
