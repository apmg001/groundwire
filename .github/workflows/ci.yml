name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t groundwire:ci .
      - name: Smoke test
        run: |
          docker run -d --name gw -p 8000:8000 groundwire:ci
          for i in $(seq 1 20); do
            curl -fsS localhost:8000/healthz && break
            sleep 1
          done
          curl -fsS -X POST localhost:8000/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"demo","messages":[{"role":"user","content":"hi"}]}'
          docker logs gw
