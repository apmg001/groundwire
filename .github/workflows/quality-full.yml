name: quality-full

# Model-based quality gates: LettuceDetect fact-checking and the semantic cache.
# Heavier (CPU torch + model downloads), so it runs only where it matters:
# on main, on PRs that touch model-facing code, weekly (catches upstream model or
# library drift even when nobody pushes), and on demand.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/groundwire/guardrails/**"
      - "src/groundwire/cache/**"
      - "src/groundwire/evals/**"
      - "config/quality_gates.yaml"
      - "pyproject.toml"
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  group: quality-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU-only torch keeps the download small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[nli,bench]"

      - name: Cache benchmark data
        uses: actions/cache@v4
        with:
          path: data/
          key: bench-data-${{ hashFiles('scripts/download_ragtruth.sh', 'scripts/download_qqp.sh') }}

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('config/quality_gates.yaml') }}

      - name: Download benchmark data
        run: |
          ./scripts/download_ragtruth.sh
          ./scripts/download_qqp.sh

      - name: Quality gate (full)
        run: python -m groundwire.evals.gate --suite full

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-full
          path: results/gates/
          if-no-files-found: ignore
