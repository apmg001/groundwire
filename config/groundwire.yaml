# --------------------------------------------------------------------------- #
# Groundwire gateway configuration
#
# Secrets never go in this file: providers reference an env var via
# `api_key_env`. Disabled providers are skipped and need no key, so you can
# enable cloud fallbacks just by exporting a key and flipping `enabled`.
# --------------------------------------------------------------------------- #

request_timeout_s: 90          # end-to-end deadline across retries + failover

retry:
  max_attempts: 2              # per provider, before failing over
  base_delay_s: 0.2
  max_delay_s: 2.0

circuit_breaker:
  failure_threshold: 5         # consecutive failures that open the circuit
  recovery_timeout_s: 30       # how long to stop sending traffic before probing
  half_open_max_calls: 1

grounding:
  scorer: lexical              # lexical (no deps) | nli | hybrid (nli + hybrid need: pip install -e ".[nli]")
  nli_model: cross-encoder/nli-deberta-v3-small
  support_threshold: 0.6
  min_supported_ratio: 0.8
  min_claim_tokens: 3
  on_error: fail_open          # fail_open | fail_closed

safety:
  injection:
    action: block              # off | flag | block
    detector: heuristic        # heuristic | classifier | both (classifier needs: make install-nli)
    threshold: 0.7             # score at or above which the action applies
    scan_user_messages: true   # direct injection
    scan_context: true         # indirect injection hidden in grounding documents
  pii:
    enabled: true              # replace PII with placeholders before any provider sees it
    types: [email, phone, card, aadhaar, pan, ip_address]
    restore_output: true       # put real values back into the answer for the client

cache:
  enabled: true                # reuse earlier answers: saves tokens, money and latency
  semantic: false              # true = also match reworded questions (needs: make install-nli)
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  similarity_threshold: 0.96   # measured: <1% wrong answers on QQP with MiniLM (make bench-cache)
  ttl_s: 3600                  # answers expire after an hour
  max_entries: 10000           # least recently used answers are evicted beyond this
  max_temperature: 1.0         # hotter requests asked for variety; don't cache them
  lookup_timeout_s: 0.5        # a slow cache is skipped, never waited on
  coalesce: true               # identical in-flight requests share one provider call
  partition_by_user: false     # true = separate cache per OpenAI `user` (multi-tenant)
  namespace: v1                # bump to invalidate everything (e.g. new system prompt)

providers:
  # Local model served by llama.cpp:  llama-server -m qwen2.5-3b-instruct-q4_k_m.gguf --port 8080
  - name: llama-local
    type: openai_compatible
    base_url: http://localhost:8080/v1
    model: qwen2.5-3b-instruct
    timeout_s: 120             # CPU generation is slow; be generous
    max_connections: 8

  # Ollama exposes an OpenAI-compatible API under /v1.
  - name: ollama-local
    type: openai_compatible
    base_url: http://localhost:11434/v1
    model: qwen2.5:3b
    timeout_s: 120
    enabled: true

  - name: groq
    type: openai_compatible
    base_url: https://api.groq.com/openai/v1
    model: llama-3.1-8b-instant
    api_key_env: GROQ_API_KEY
    timeout_s: 30
    enabled: false

  - name: openai
    type: openai_compatible
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    timeout_s: 30
    enabled: false

  - name: anthropic
    type: anthropic
    base_url: https://api.anthropic.com
    model: claude-haiku-5-5
    api_key_env: ANTHROPIC_API_KEY
    timeout_s: 30
    enabled: false

  # In-process mocks for demos, load tests and chaos tests.
  - name: mock-flaky
    type: mock
    model: mock-1
    mock:
      response_text: "Invoice INV-1042 totals 1,200 USD and is due on 15 March."
      latency_s: 0.05
      failure_rate: 0.5
      seed: 7

  - name: mock-stable
    type: mock
    model: mock-1
    mock:
      response_text: "Invoice INV-1042 totals 1,200 USD and is due on 15 March."
      latency_s: 0.02

  # Cascade demo: a "cheap" mock that invents a number and a "strong" mock that doesn't.
  - name: mock-cheap
    type: mock
    model: mock-small
    mock:
      response_text: "The refund for order 7781 is 89.99 USD."
      latency_s: 0.01

  - name: mock-strong
    type: mock
    model: mock-large
    mock:
      response_text: "The refund for order 7781 is 49.99 USD and was issued on 2 May."
      latency_s: 0.05

  # Agent demo: requests the issue_refund tool when offered, then answers in text.
  - name: mock-agent
    type: mock
    model: mock-agent
    mock:
      response_text: "Your refund for order 7781 has been issued."
      latency_s: 0.01
      tool_call:
        name: issue_refund
        arguments: {order_id: 7781, amount: 49.99}

  # Guardrail demo: asks for a refund far above the refund-cap rule (5000).
  - name: mock-agent-greedy
    type: mock
    model: mock-agent
    mock:
      response_text: "Your refund for order 7781 has been issued."
      latency_s: 0.01
      tool_call:
        name: issue_refund
        arguments: {order_id: 7781, amount: 100000}

  # Answer-check demo: refunds $1, then tells the user it refunded $49.99 (the
  # exact mistake Qwen 2.5 3B made in a real run). The gateway flags the answer.
  # Approval demo: a $1,200 refund, above the refund-approval threshold (500).
  - name: mock-agent-approval
    type: mock
    model: mock-agent
    mock:
      response_text: "Your refund of $1200 for order 4417 has been issued."
      latency_s: 0.01
      tool_call:
        name: issue_refund
        arguments: {order_id: 4417, amount: 1200}

  - name: mock-agent-liar
    type: mock
    model: mock-agent
    mock:
      response_text: "I have refunded $49.99 for order 7781."
      latency_s: 0.01
      tool_call:
        name: issue_refund
        arguments: {order_id: 7781, amount: 1}

routes:
  # Local first; cloud providers only take over if enabled and local fails.
  default: [llama-local, ollama-local, groq, openai, anthropic]
  # Demonstrates retries, circuit breaking and failover with no network at all.
  demo: [mock-flaky, mock-stable]
  # Tool-calling demo (no API key needed).
  agent-demo: [mock-agent]
  agent-demo-risky: [mock-agent-greedy]   # blocked by tool_policy refund-cap
  agent-demo-approval: [mock-agent-approval] # held until a reviewer approves (make agent-approval)
  agent-demo-liar: [mock-agent-liar]       # wrong amount in the answer: answer_check flags it
  # A real local model with tool calling: make agent / make agent-risky (needs Ollama running).
  ollama: [ollama-local]

# Cheap-first routing: try the cheap tier, fact-check its answer against the request's
# grounding documents, escalate to the strong tier only if the check fails.
# Measured on RAGTruth (make bench-cascade-token): pays off only when the cheap model is
# already decent. Watch groundwire_cascade_requests_total{reason="low_support"}.
cascades:
  smart-demo:
    cheap: [mock-cheap]
    strong: [mock-strong]
    escalate_below: 0.5        # with the default lexical scorer: share of supported claims
    on_check_error: escalate   # escalate | serve_cheap
    without_context: strong    # no documents to check against -> strong | cheap

# Guardrails for tool calls made by AI agents (OWASP LLM06 "Excessive Agency").
# The model only proposes actions; these rules decide, in code, before the agent sees them.
tool_policy:
  enabled: true
  on_violation: drop           # drop: remove the call and explain in text | error: HTTP 422
  injection_lockdown: true     # suspected prompt injection in the request -> no tool may run
  max_tool_rounds: 25          # stop runaway agent loops (OWASP LLM10)
  validate_arguments: true     # arguments must match the tool's own JSON Schema
  reject_unknown_tools: true   # block tools the request never offered
  default_action: allow        # set to block for an allowlist
  rules:                       # first matching rule wins (like a firewall)
    # Refunds of 500 or more wait for a human (and are still capped at 5000).
    - name: refund-approval
      tools: [issue_refund]
      action: require_approval
      when:
        amount: {min: 500}
      arguments:
        amount: {max: 5000}
    - name: refund-cap
      tools: [issue_refund]
      arguments:
        amount: {max: 5000}
    - name: no-deletes
      tools: ["delete_*", "drop_*"]
      action: block

# Human approval for tool calls held by a require_approval rule. An approval is
# permission for one exact call (same tool, arguments and `user`), used once.
# Reviewers use /v1/approvals with the token in the env var below (the reviewer
# API is disabled while it is unset). In-memory store: single replica, and
# pending requests are lost on restart (agents simply ask again).
approvals:
  enabled: true
  store: memory
  ttl_s: 900                   # a request waits 15 minutes for a decision
  grant_ttl_s: 600             # an approved call must be used within 10 minutes
  retention_s: 86400           # decided records stay visible for a day
  max_records: 10000
  max_pending_per_scope: 20    # one user cannot flood reviewers
  reviewer_token_env: GROUNDWIRE_APPROVER_TOKEN

# Fact-check agents' final answers against their tool results (numbers, claimed
# actions). Catches "I refunded $49.99" when the refund tool returned amount 1.
answer_check:
  enabled: true
  action: flag                 # flag: report in metadata | annotate: add a warning | block: HTTP 422
  window_words: 6              # how close a number must be to a tool's words to be bound to it
  min_unbound_value: 100       # plain numbers near no tool are only checked from this size up

default_route: default
