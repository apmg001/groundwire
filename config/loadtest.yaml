# Gateway config for load and chaos tests (make loadtest-*).
#
# Same features as production (safety, PII, cache, grounding, tool policy,
# answer check), but providers are two fake OpenAI-compatible servers
# (loadtest/fake_upstream.py) so the numbers measure the gateway, not a model.
# upstream-a is primary; chaos tests break it to exercise failover.

request_timeout_s: 30
retry:
  max_attempts: 2
  base_delay_s: 0.05
  max_delay_s: 0.5
circuit_breaker:
  failure_threshold: 5
  recovery_timeout_s: 10
  half_open_max_calls: 1

grounding:
  scorer: lexical
  on_error: fail_open

safety:
  injection:
    action: flag
    detector: heuristic
  pii:
    enabled: true

cache:
  enabled: true
  semantic: false
  max_entries: 10000
  coalesce: true

providers:
  - name: upstream-a
    type: openai_compatible
    model: fake-model
    base_url: http://127.0.0.1:9101/v1
    timeout_s: 10
    max_connections: 200
  - name: upstream-b
    type: openai_compatible
    model: fake-model
    base_url: http://127.0.0.1:9102/v1
    timeout_s: 10
    max_connections: 200

routes:
  default: [upstream-a, upstream-b]

tool_policy:
  enabled: true
  rules:
    - name: refund-cap
      tools: [issue_refund]
      arguments:
        amount: {max: 5000}

answer_check:
  enabled: true
  action: flag

approvals:
  enabled: false
