[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "groundwire"
version = "0.1.0"
description = "Self-hosted, OpenAI-compatible LLM gateway with failover, circuit breaking and grounding verification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prasun Mani Gupta", email = "apmgupta001@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# NLI grounding scorer. Heavy (torch); install only where you need it.
nli = ["transformers>=4.48.3", "torch>=2.3", "sentencepiece>=0.2", "protobuf>=4.25"]
# Reads the QQP parquet files for the semantic-cache benchmark.
bench = ["pyarrow>=15"]
# Load, stress, spike, chaos and soak tests (python -m loadtest.run ...).
load = ["locust==2.31.8", "psutil>=5.9"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
groundwire = "groundwire.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwire"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "SIM", "RET", "PTH", "LOG", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["groundwire"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests that wire the full FastAPI app"]
filterwarnings = [
    # Third-party: newer Starlette nags about its own TestClient's httpx usage.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["groundwire"]
branch = true
